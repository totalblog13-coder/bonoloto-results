name: Update results.json

on:
  # Cron отключён: API loteriasyapuestas.es блокирует IP GitHub Actions
  # (geo-fence Spain only). Скрапер крутится на Linux-машине пользователя,
  # см. ~/bonoloto-results/daily.sh + cron на Mint. Здесь оставлен только
  # ручной запуск — на случай ручного дебага из веб-UI.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python update.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain results.json)" ]]; then
            git add results.json
            git commit -m "results: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes in results.json"
          fi
